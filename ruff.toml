line-length = 120
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "PLW"]
ignore = ["S101", "S603", "S607", "S104"]

[lint.isort]
known-first-party = ["swsdb_server"]

[lint.per-file-ignores]
# benchmarks build queries from integers and use a seeded RNG on purpose
"benchmarks/**" = ["S311", "S608"]
# FastAPI dependencies are declared as argument defaults by design
"server/swsdb_server/api_v1.py" = ["B008"]
"server/swsdb_server/app.py" = ["B008"]
"server/swsdb_server/qdrant_proxy.py" = ["B008"]
# tests use seeded randomness for reproducible chaos runs
"tests/**" = ["S311"]
