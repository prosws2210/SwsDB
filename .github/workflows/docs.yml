name: docs

# Builds the docs site on every change (broken links fail the build) and publishes it to GitHub Pages from main.
# One-time setup: repository Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
    paths: ["docs/**", "mkdocs.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx --with mkdocs-material==9.* mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
