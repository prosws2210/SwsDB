name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uv run --project server --frozen ruff check server/swsdb_server sdk tests benchmarks examples
      - name: Unit tests
        run: uv run --project server --frozen pytest -q
      - name: Helm chart
        run: |
          helm lint deploy/helm/swsdb --set apiKey.value=ci
          helm template ci deploy/helm/swsdb --set apiKey.value=ci --set ingress.enabled=true > /dev/null
          ! helm template ci deploy/helm/swsdb 2>/dev/null   # refuses to render without an API key

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the previous release is built for the upgrade test
      - uses: astral-sh/setup-uv@v6
      - name: Build the image
        run: docker build -f docker/Dockerfile -t swsdb/swsdb:dev .
      - name: Build the previous release (upgrade test)
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || echo 6f119dd)
          echo "previous release: $prev"
          git archive "$prev" | docker build -f docker/Dockerfile -t swsdb/swsdb:prev -
      - name: Container tests (lifecycle, API, documents, consistency, security, snapshots, upgrade, agents)
        run: uv run --project server --frozen pytest -q -m image tests/image --ignore=tests/image/test_quality.py
      - name: Retrieval quality (fails on regressions)
        env:
          SWSDB_QUALITY_REPORT: quality.json
        run: uv run --project server --frozen pytest -q -m image tests/image/test_quality.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: quality.json
          if-no-files-found: ignore
      - name: Image size
        run: docker image inspect swsdb/swsdb:dev --format 'image size {{.Size}} bytes'
