<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>swsdb console</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="brand-mark" id="brand-mark"></div>
        <div><div class="brand-name">swsdb</div><div class="brand-sub">AI data layer</div></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div class="side-card">
          <div class="field-label">Tenant</div>
          <input id="tenant" value="default" spellcheck="false" autocomplete="off" aria-label="Tenant">
          <div class="row between">
            <button id="key-btn" class="btn ghost grow" type="button"></button>
            <button id="theme-btn" class="btn ghost icon" type="button" aria-label="Toggle theme" title="Toggle theme"></button>
          </div>
        </div>
        <div id="version" class="side-meta"></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="title"><h1 id="title">Overview</h1><p id="subtitle"></p></div>
        <div class="top-actions"><div id="actions" class="row"></div><div id="conn" class="conn"><span class="d"></span><span>connecting</span></div></div>
      </header>
      <div id="error" class="banner hidden"></div>
      <section id="page" class="stack"></section>
    </main>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="key-dialog">
    <form method="dialog">
      <h2>API key</h2>
      <div class="muted small">Needed when the server sets SWSDB_API_KEY. It stays in this browser tab only (session storage) and is sent as the <span class="kbd">api-key</span> header.</div>
      <input id="key-input" type="password" autocomplete="off" placeholder="Paste the admin or read-only key">
      <div class="row end"><button value="clear" class="btn ghost" id="key-clear">Forget key</button><button value="cancel" class="btn ghost">Cancel</button><button id="key-save" value="ok" class="btn primary">Save</button></div>
    </form>
  </dialog>
  <script src="app.js" type="module"></script>
</body>
</html>
