{{- if or (and .Values.apiKey.value (not .Values.apiKey.existingSecret)) (and .Values.readOnlyApiKey.value (not .Values.readOnlyApiKey.existingSecret)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "swsdb.fullname" . }}-keys
  labels: {{- include "swsdb.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.apiKey.value }}
  {{ .Values.apiKey.key }}: {{ .Values.apiKey.value | quote }}
  {{- end }}
  {{- if .Values.readOnlyApiKey.value }}
  {{ .Values.readOnlyApiKey.key }}: {{ .Values.readOnlyApiKey.value | quote }}
  {{- end }}
{{- end }}
