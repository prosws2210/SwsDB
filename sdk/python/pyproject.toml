[project]
name = "swsdb"
dynamic = ["version"]
description = "Python client and CLI for swsdb: one database for AI applications (relational, vector and graph)."
readme = "README.md"
license = "FSL-1.1-ALv2"
authors = [{ name = "Shakti Swaroop Sahu" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
keywords = ["database", "vector", "graph", "rag", "graphrag", "postgres", "qdrant", "falkordb"]

[project.optional-dependencies]
mcp = ["mcp>=1.10,<2"]  # `swsdb mcp`: the MCP server for agents
langchain = ["langchain-core>=0.3"]  # swsdb.langchain.SwsDBRetriever
llama-index = ["llama-index-core>=0.12"]  # swsdb.llama_index.SwsDBRetriever

[project.scripts]
swsdb = "swsdb.cli:main"

[project.urls]
Homepage = "https://github.com/prosws2210/SwsDB"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "swsdb/__init__.py"
